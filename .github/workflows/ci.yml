name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Coverage floor. The package is checked block for block against
  # crypto/cipher on every arch; arm64 runs the assembly kernels and, with
  # accelerated cleared, the portable path; the other arches run the
  # portable path only. 100% of statements everywhere.
  COVER_MIN: "100.0"

jobs:
  # ---- Native runners: full race-enabled run with the coverage gate ----
  native:
    name: native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: true
          cache: true
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (race + coverage gate)
        run: |
          set -euo pipefail
          go test -race -coverprofile=cover.out ./... | tee cover.txt
          go tool cover -func=cover.out | tail -1
          pct=$(grep -oE 'coverage: [0-9.]+%' cover.txt | grep -oE '[0-9.]+' | head -1)
          echo "coverage on ${{ matrix.arch }}: ${pct}% (floor ${COVER_MIN}%)"
          awk -v p="$pct" -v m="$COVER_MIN" 'BEGIN { exit !(p+0 >= m+0) }' \
            || { echo "coverage ${pct}% < ${COVER_MIN}%"; exit 1; }

  # ---- Emulated targets (QEMU via binfmt) ------------------------------
  # riscv64, loong64, ppc64le and big-endian s390x use crypto/cipher, and
  # their tests check that the portable path is byte-identical. The race
  # detector is not supported under cross/QEMU, so these run the
  # cover-instrumented test binaries and gate on coverage.
  emulated:
    name: emulated ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu_cpu: "rv64,v=true,vlen=128"
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu_cpu: la464
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: power9
          - arch: s390x
            image: debian:trixie
            qemu_cpu: qemu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: true
          cache: true

      - name: register QEMU binfmt handlers
        run: docker run --rm --privileged tonistiigi/binfmt --install all

      - name: cross-compile per-package test binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p _tbin
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/.' '__')
            go test -c -cover -covermode=atomic -o "_tbin/${name}.test" "$pkg"
          done
          ls -l _tbin

      - name: run test binaries under QEMU (${{ matrix.arch }})
        run: |
          set -euo pipefail
          fail=0
          for bin in _tbin/*.test; do
            [ -e "$bin" ] || continue
            echo "::group::$bin"
            out=$(docker run --rm --platform linux/${{ matrix.arch }} \
              -e QEMU_CPU='${{ matrix.qemu_cpu }}' \
              -v "$PWD/_tbin:/tbin:ro" \
              ${{ matrix.image }} "/tbin/$(basename "$bin")" -test.v 2>&1) || fail=1
            echo "$out"
            pct=$(echo "$out" | grep -oE 'coverage: [0-9.]+%' | grep -oE '[0-9.]+' | head -1)
            if [ -n "${pct:-}" ]; then
              echo "coverage on ${{ matrix.arch }} ($bin): ${pct}% (floor ${COVER_MIN}%)"
              awk -v p="$pct" -v m="$COVER_MIN" 'BEGIN { exit !(p+0 >= m+0) }' \
                || { echo "coverage ${pct}% < ${COVER_MIN}%"; fail=1; }
            fi
            echo "::endgroup::"
          done
          exit $fail

  # ---- Differential fuzzing against crypto/cipher (arm64 runs the kernel) ----
  fuzz:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
      - run: go test -run '^$' -fuzz '^FuzzDecrypt$' -fuzztime 60s .

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
